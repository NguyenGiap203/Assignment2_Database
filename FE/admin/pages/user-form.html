<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chỉnh sửa Người dùng</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>

<div id="navbar"></div>

<div class="container">
    <h2 id="uf_title">Chỉnh sửa người dùng</h2>

    <!-- Thông tin chỉ xem -->
    <div class="form-grid">
        <div>
            <label>ID</label>
            <input id="u_id" readonly>
        </div>
        <div>
            <label>Username</label>
            <input id="u_username" readonly>
        </div>
        <div>
            <label>Họ tên</label>
            <input id="u_fullname" readonly>
        </div>
        <div>
            <label>Email</label>
            <input id="u_email" readonly>
        </div>
        <div>
            <label>Điện thoại</label>
            <input id="u_phone" readonly>
        </div>
    </div>

    <hr style="margin:20px 0">

    <!-- Admin chỉ được quyền chỉnh những mục này -->
    <div class="form-grid">
        <div>
            <label>Vai trò</label>
            <select id="u_role">
                <option value="User">User</option>
                <option value="Teacher">Teacher</option>
            </select>
        </div>

        <div>
            <label>Trạng thái</label>
            <select id="u_status">
                <option value="active">Active</option>
                <option value="locked">Locked</option>
            </select>
        </div>
    </div>

    <div style="margin-top:20px;">
      <button onclick="saveUser()">Lưu thay đổi</button>
      <button class="secondary" onclick="location.href='user-list.html'">Hủy</button>
      <p id="u_msg" class="note"></p>
    </div>
</div>

<script src="../js/db.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/user.js"></script>
</body>
</html>
