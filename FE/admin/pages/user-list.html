<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Danh sách Người dùng</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <h2>Người dùng</h2>

    <div class="topbar">
  <input id="u_search" placeholder="Tìm theo username / fullname / email" oninput="renderUsers()">

  <!-- NEW: lọc role -->
  <select id="u_role" onchange="renderUsers()">
    <option value="">Tất cả vai trò</option>
    <option value="User">User</option>
    <option value="Teacher">Teacher</option>
  </select>

  <select id="u_status" onchange="renderUsers()">
    <option value="">Tất cả trạng thái</option>
    <option value="active">Active</option>
    <option value="locked">Locked</option>
  </select>

</div>

<table class="table" id="u_table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Họ tên</th>
      <th>Email</th>
      <th>Điện thoại</th>
      <th>Vai trò</th> <!-- NEW -->
      <th>Trạng thái</th>
      <th>Ngày tham gia</th>
      <th>Hành động</th>
    </tr>
  </thead>
  <tbody id="u_tbody"></tbody>
</table>

  <script src="../js/db.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/user.js"></script>
</body>
</html>
