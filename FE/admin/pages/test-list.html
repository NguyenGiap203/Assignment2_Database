<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Danh sách Test - Khóa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <button onclick="history.back()" class="secondary">Return</button>
    <h2>Danh sách Test</h2>

    <div class="topbar">
      <input id="t_search" placeholder="Tìm theo id / tên" oninput="renderTests()">
      <select id="t_status" onchange="renderTests()">
        <option value="">Tất cả trạng thái</option>
        <option value="active">Active</option>
        <option value="locked">Locked</option>
      </select>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Tên Test</th>
          <th>Chương</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="test_tbody"></tbody>
    </table>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/test.js"></script>
</body>
</html>
