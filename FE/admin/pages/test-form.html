<!DOCTYPE html><html><head>
<meta charset="utf-8"><title>Chỉnh sửa Test</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/navbar.css"></head>
<body>
<div id="navbar"></div>
<div class="container">
  <h2 id="tf_title">Chỉnh sửa Test</h2>
  <div class="form-grid">
    <div><label>ID</label><input id="tf_id" readonly></div>
    <div class="form-full"><label>Tên</label><input id="tf_title_input" readonly></div>
    <div class="form-full"><label>Mô tả</label><textarea id="tf_desc" rows="3" readonly></textarea></div>
    <div><label>Trạng thái</label>
      <select id="tf_status"><option value="active">active</option><option value="locked">locked</option></select></div>
  </div>

  <div style="margin-top:16px;">
    <button onclick="saveTest()">Lưu</button>
    <button class="secondary" onclick="location.href='test-list.html'">Hủy</button>
  </div>
</div>

<script src="../js/db.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/test-form.js"></script>
</body></html>
