<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Danh sách Bài tập</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h2>Bài tập (Exercises)</h2>

    <div class="topbar">
      <input id="ex_search" placeholder="Tìm theo id / tên / chương" oninput="renderExercises()">
      <select id="ex_status" onchange="renderExercises()">
        <option value="">Tất cả trạng thái</option>
        <option value="active">Active</option>
        <option value="locked">Locked</option>
      </select>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Tên bài</th>
          <th>Độ khó</th>
          <th>Chương</th>
          <th>Tác giả</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="ex_tbody"></tbody>
    </table>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/exercise.js"></script>
</body>
</html>
