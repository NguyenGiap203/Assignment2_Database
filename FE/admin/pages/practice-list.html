<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Danh sách Bài luyện tập</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <h2>Bài luyện tập</h2>

    <div class="topbar">
      <input id="p_search" placeholder="Tìm theo id / tên / chương" oninput="renderPractices()">
      <select id="p_status" onchange="renderPractices()">
        <option value="">Tất cả trạng thái</option>
        <option value="active">Active</option>
        <option value="locked">Locked</option>
      </select>
    </div>

    <table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Tên bài</th>
      <th>Độ khó</th>
      <th>Tác giả</th>
      <th>Trạng thái</th>
      <th>Hành động</th>
    </tr>
  </thead>
  <tbody id="p_tbody"></tbody>
</table>

  </div>

  <script src="../js/db.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/practice.js"></script>
</body>
</html>
