<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chi tiết Bài luyện tập</title>
  <link rel="stylesheet" href="../css/style.css">

</head>
<body>
  <div id="navbar"></div>

  <div class="container">

      <div class="form-full"><label>Đề bài</label><textarea id="pd_desc" rows="6" readonly></textarea></div>
      <div><label>Độ khó</label><input id="pd_diff" readonly></div>
      <div><label>Trạng thái</label><input id="pd_status" readonly></div>
      <div class="form-full">
  <label>Tác giả</label>
  <div>
    <a id="pd_author" href="#" style="font-size:16px; font-weight:500; color:#005bff;"></a>
  </div>
</div>

    </div>

    <h3>Lịch sử thực hiện</h3>
    <table class="table">
      <thead><tr><th>User</th><th>Bắt đầu</th><th>Nộp bài</th><th>Điểm</th></tr></thead>
      <tbody id="pd_history"></tbody>
    </table>

  </div>

<script src="../js/db.js"></script>
