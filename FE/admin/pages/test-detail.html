<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chi tiết Test</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <style>
    .accordion { border:1px solid #e6e6e6; border-radius:6px; overflow:hidden; }
    .q-item { border-bottom:1px solid #f1f1f1; padding:12px; }
    .q-head { display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
    .q-head h4{ margin:0; font-size:16px; }
    .q-body { display:none; padding:12px 0 0 0; }
    .ans { padding:6px 12px; border-radius:6px; margin:6px 0; }
    .ans.correct { background:#e6ffed; border:1px solid #b7f0c9; }
    .ans.wrong { background:#fff4f4; border:1px solid #f0bdbd; }
    .small-btn { padding:6px 8px; margin-left:8px; font-size:13px; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <button onclick="history.back()" class="secondary">Return</button>
    <h2>Chi tiết Test</h2>

    <div class="form-grid">
      <div><label>ID</label><input id="td_id" readonly></div>
      <div class="form-full"><label>Tên</label><input id="td_title" readonly></div>
      <div class="form-full"><label>Mô tả</label><textarea id="td_desc" rows="3" readonly></textarea></div>
      <div><label>Chương</label><input id="td_chapter" readonly></div>
      <div><label>Trạng thái</label><input id="td_status" readonly></div>
    </div>

    <hr style="margin:18px 0">

    <h3>Các câu hỏi</h3>
    <div id="td_questions" class="accordion"></div>

  </div>

  <script src="../js/db.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/test-detail.js"></script>
</body>
</html>
