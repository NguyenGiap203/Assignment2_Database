<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chi tiết Khóa học</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>

<body>
  <div id="navbar"></div>

  <div class="container">

    <button onclick="history.back()" class="secondary">← Quay lại</button>
    <h2>Chi tiết Khóa học</h2>

    <!-- Thông tin cơ bản -->
    <div class="form-grid">

      <div>
        <label>ID</label>
        <input id="cd_id" readonly>
      </div>

      <div class="form-full">
        <label>Tiêu đề</label>
        <input id="cd_title" readonly>
      </div>

      <div class="form-full">
        <label>Mô tả</label>
        <textarea id="cd_desc" rows="4" readonly></textarea>
      </div>

      <div>
        <label>Trạng thái</label>
        <input id="cd_status" readonly>
      </div>

      <div>
        <label>Thời lượng</label>
        <input id="cd_duration" readonly>
      </div>

      <div>
        <label>Số chương</label>
        <input id="cd_chapters" readonly>
      </div>

      <div>
        <label>Số video</label>
        <input id="cd_videos" readonly>
      </div>

      <div>
        <label>Số bài tập</label>
        <input id="cd_exercises" readonly>
      </div>

      <div>
  <label>Số bài kiểm tra</label>
  <div>
    <a id="cd_tests_link" href="#" style="display:inline-block; padding:8px 12px; background:#f2f6fb; border-radius:6px; text-decoration:none;" >0</a>
  </div>
</div>


      <div>
        <label>Số người tham gia</label>
        <input id="cd_participants" readonly>
      </div>

      <div>
        <label>Điểm trung bình</label>
        <input id="cd_rating" readonly>
      </div>

    </div>

    <hr style="margin: 25px 0">

    <!-- Danh sách đánh giá -->
    <h3>Đánh giá khóa học (<span id="cd_review_count">0</span>)</h3>

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Điểm</th>
          <th>Nhận xét</th>
          <th>Người dùng</th>
          <th>Ngày đánh giá</th>
        </tr>
      </thead>
      <tbody id="cd_review_body"></tbody>
    </table>

    <hr style="margin: 25px 0">

    <!-- Danh sách người tham gia -->
    <h3>Người tham gia (<span id="cd_user_count">0</span>)</h3>

    <table class="table">
      <thead>
        <tr>
          <th>Mã đăng ký</th>
          <th>User</th>
          <th>Ngày tham gia</th>
          <th>Trạng thái</th>
        </tr>
      </thead>
      <tbody id="cd_user_body"></tbody>
    </table>

  </div>

  <script src="../js/db.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/course-detail.js"></script>

</body>
</html>
