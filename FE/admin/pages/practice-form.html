<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chỉnh sửa Practice</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <h2 id="pf_title">Chỉnh sửa Practice</h2>

    <div class="form-grid">
      <div><label>ID</label><input id="pf_id" readonly></div>
      <div class="form-full"><label>Tên</label><input id="pf_title_input" readonly></div>
      <div class="form-full"><label>Đề bài</label><textarea id="pf_desc" rows="4" readonly></textarea></div>

      <div>
        <label>Trạng thái</label>
        <select id="pf_status">
          <option value="active">active</option>
          <option value="locked">locked</option>
        </select>
      </div>
    </div>

    <div style="margin-top:16px;">
      <button onclick="savePractice()">Lưu</button>
      <button class="secondary" onclick="location.href='practice-list.html'">Hủy</button>
      <p id="pf_msg" class="note"></p>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/practice-form.js"></script>
</body>
</html>
