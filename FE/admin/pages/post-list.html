<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bài chia sẻ</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>

<body>
  <div id="navbar"></div>

  <div class="container">
    <h2>Bài chia sẻ</h2>

    <div class="topbar">
      <input id="post_search" placeholder="Tìm theo id / tên / tác giả" oninput="renderPosts()">
      <select id="post_status" onchange="renderPosts()">
        <option value="">Tất cả trạng thái</option>
        <option value="active">Active</option>
        <option value="locked">Locked</option>
      </select>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Tiêu đề</th>
          <th>Tác giả</th>
          <th>Trạng thái</th>
          <th>Ngày đăng</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="post_tbody"></tbody>
    </table>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/post.js"></script>
</body>
</html>
