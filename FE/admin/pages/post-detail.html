<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chi tiết bài chia sẻ</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>

<body>
<div id="navbar"></div>

<div class="container">

  <button onclick="history.back()" class="secondary">Return</button>
  <h2>Chi tiết Bài chia sẻ</h2>

  <div class="form-grid">

    <div>
      <label>ID</label>
      <input id="pd_id" readonly>
    </div>

    <div class="form-full">
      <label>Tiêu đề</label>
      <input id="pd_title" readonly>
    </div>

    <div class="form-full">
      <label>Nội dung</label>
      <textarea id="pd_content" rows="5" readonly></textarea>
    </div>

    <div>
      <label>Ngày đăng</label>
      <input id="pd_date" readonly>
    </div>

    <div>
      <label>Tác giả</label>
      <a id="pd_author" href="#">(author)</a>
    </div>

    <div>
      <label>Trạng thái</label>
      <input id="pd_status" readonly>
    </div>

  </div>

  <hr style="margin:20px 0">

  <h3 id="cmt_header">Bình luận (0)</h3>

  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nội dung</th>
        <th>Người bình luận</th>
        <th>Thuộc</th>
        <th>Ghi chú</th>
        <th>Ngày</th>
      </tr>
    </thead>
    <tbody id="pd_cmt_body"></tbody>
  </table>

</div>

<script src="../js/db.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/post-detail.js"></script>
</body>
</html>
