<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chỉnh sửa Bài tập</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h2 id="ef_title">Chỉnh sửa Bài tập</h2>

    <div class="form-grid">
      <div><label>ID</label><input id="ef_id" readonly></div>
      <div class="form-full"><label>Tên</label><input id="ef_title_input" readonly></div>
      <div class="form-full"><label>Đề bài</label><textarea id="ef_desc" rows="4" readonly></textarea></div>

      <div>
        <label>Trạng thái</label>
        <select id="ef_status">
          <option value="active">active</option>
          <option value="locked">locked</option>
        </select>
      </div>
    </div>

    <div style="margin-top:16px;">
      <button onclick="saveExercise()">Lưu</button>
      <button class="secondary" onclick="location.href='exercise-list.html'">Hủy</button>
      <p id="ef_msg" class="note"></p>
    </div>
  </div>

<script src="../js/db.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/exercise-form.js"></script>
</body>
</html>
